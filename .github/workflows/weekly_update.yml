name: Weekly F1 Model Update

on:
  schedule:
    # Run at 14:00 UTC every Tuesday (gives ~46hr buffer after Sunday race for FastF1 telemetry to be fully published)
    - cron: '0 14 * * 2'
  workflow_dispatch: # Allows you to run it manually with a button click

permissions:
  contents: write

jobs:
  update-model:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: |
        pip install pandas scikit-learn joblib fastf1

    - name: Run Auto-Updater
      run: python src/auto_updater.py

    - name: Commit and Push Changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto-Update: Retrained model with latest race data"
        file_pattern: 'models/*.pkl data/*.csv'